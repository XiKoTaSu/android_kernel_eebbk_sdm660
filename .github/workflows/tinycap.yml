name: Build tinycap

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tinycap.yml'

jobs:
  tinycap:
    name: Build tinycap (aarch64 static)
    runs-on: ubuntu-22.04
    steps:
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl

      - name: Fetch aarch64 gcc
        run: |
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-gnu-9.3 -b lineage-19.1 --depth=1 $GITHUB_WORKSPACE/gcc
          ls $GITHUB_WORKSPACE/gcc/bin | head
          find $GITHUB_WORKSPACE/gcc -name 'libc.a' | head

      - name: Build tinyalsa tools (static)
        run: |
          export PATH="$GITHUB_WORKSPACE/gcc/bin:$PATH"
          git clone https://github.com/tinyalsa/tinyalsa --depth=1 $GITHUB_WORKSPACE/tinyalsa
          cd $GITHUB_WORKSPACE/tinyalsa
          make clean || true
          make CC=aarch64-linux-gcc CFLAGS="-O2 -static" LDFLAGS="-static" -j$(nproc) 2>&1 | tail -20
          ls -l utils/
          for f in utils/tinycap utils/tinymix utils/tinyplay; do
            echo "== $f"; readelf -l $f | grep -c INTERP || true
          done

      - name: Upload tools
        uses: actions/upload-artifact@v4
        with:
          name: tinyalsa-tools
          path: |
            tinyalsa/utils/tinycap
            tinyalsa/utils/tinymix
            tinyalsa/utils/tinyplay
