name: Build tinycap

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tinycap.yml'

jobs:
  tinycap:
    name: Build tinycap (android aarch64 static)
    runs-on: ubuntu-22.04
    steps:
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y unzip git

      - name: Fetch NDK
        run: |
          curl -sSL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r26b-linux.zip
          unzip -q ndk.zip
          ls -d android-ndk-r26b

      - name: Build tinyalsa utils with NDK (static bionic)
        run: |
          export NDK=$GITHUB_WORKSPACE/android-ndk-r26b
          export CC=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
          git clone -b v1.1.1 https://github.com/tinyalsa/tinyalsa --depth=1 tinyalsa
          cd tinyalsa
          mkdir -p out
          SRCS="src/mixer.c src/pcm.c"
          for tool in tinycap tinymix tinyplay; do
            echo "== $tool"
            $CC -O2 -static -Iinclude -Isrc -o out/$tool utils/$tool.c $SRCS || echo "FAILED $tool"
          done
          ls -l out/ || true
          for f in out/*; do echo "-- $f"; file $f; done

      - name: Upload tools
        uses: actions/upload-artifact@v4
        with:
          name: tinyalsa-tools
          path: tinyalsa/out/
          if-no-files-found: error

